[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workbay"
version = "0.2.0"
description = "Workbay - a workbench of local tools around workspaces (west / git status, builds, Claude Code history), one page on 127.0.0.1"
requires-python = ">=3.10"
dependencies = [
    "west>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
workbay = "workbay.__main__:main"

[tool.setuptools.packages.find]
include = ["workbay*"]

[tool.setuptools.package-data]
workbay = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
